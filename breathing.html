<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBloom</title>
    <link rel="stylesheet" href="css/breathing_style.css">
    <meta name="description" content="MindBloom">
    <link rel="icon" href="favicon.svg">
</head>

<body>
    <div class="home">
        <!-- BREATHING SCREEN (visible by default) -->
        <div id="breathing-screen" class="breathing-screen">
            <button id="breathing-back" class="breathing-back">← Back</button>
            <span class="breathing-eyebrow">ONE MINUTE RESET</span>
            <h2>Make space to breathe</h2>
            <p>Follow the circle at a pace that feels comfortable.</p>

            <div class="bubble-stage">
                <div id="bubble" class="bubble">
                    <div class="bubble-inner">
                        <strong id="bubble-title">Tap to begin</strong>
                        <span id="bubble-sub">1 minute</span>
                    </div>
                </div>
            </div>

            <button id="breathing-pause" class="breathing-pause hidden">Pause</button>
        </div>
    </div>

    <script src="js/breathing.js"></script>
</body>
</html>
