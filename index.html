<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MindBloom</title>
        
        <!-- Link Manifest & Theme Color -->
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#ffffff">
        <link rel="stylesheet" href="style.css">
        <meta charset = "UTF-8">
        <meta name = "viewport" content="width = device-width, initial-scale = 1.0">
        <meta name = "description" content="MindBloom">
        <link rel = "icon" href = "favicon.svg">
    </head>

    <body>
        <div class = "home">
            <div class = "side-bar">
            </div>
            <div class = "home">
                <div class = "header">
                    <div>
                        <div id="live-date"></div>
                        <h3>Good Morning, Alex</h3>
                    </div>
                    <div class = "streak">
                        <p>6 day streak</p>
                    </div>
                </div>
                <div class = "garden">
                    <p>Placeholder Imagine there is a garden here</p>
                    <div class = "progress-bar">
                        <p>If you squint your eyes enough this is a progress bar ###########           ./ 50%</p>
                    </div>
                </div>
                <div class = "feels">
                    Happy Not Happy and various feelings (Placeholder)
                </div>
                <p> Give yourself a moment</p>
                <div class = "self_care">
                    <h4>Quick care</h4>
                    <a>Breathe</a>
                    <a>Reflect</a>
                </div>
            </div>
        </div>


        <!--Time and Date Script-->
        <script>
        function updateDate() {
            const now = new Date();
            
            const options = { 
            weekday: 'long', 
            month: 'long', 
            day: 'numeric' 
            };
            
            const formattedDate = now.toLocaleDateString('en-US', options);
            
            document.getElementById('live-date').textContent = formattedDate;
        }

        updateDate();

        setInterval(updateDate, 60000);
        </script>
        

    </body>

</html>
