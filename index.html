
<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MindBloom</title>
        <link rel="stylesheet" href="style.css">
        <meta name="description" content="MindBloom">
        <link rel="icon" href="favicon.svg">
    </head>

    <body>
        <div class="home">
            <div class="side-bar">
                <a href="#" class="active" title="Home" aria-label="Home">
                    <svg viewBox="0 0 24 24">
                        <path d="m3 11 9-8 9 8"></path>
                        <path d="M5 10v10h14V10M9 20v-6h6v6"></path>
                    </svg>
                </a>

                <a href="#" title="Chat" aria-label="Chat">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3c.7 4.1 2.9 6.3 7 7-4.1.7-6.3 2.9-7 7-.7-4.1-2.9-6.3-7-7 4.1-.7 6.3-2.9 7-7Z"></path>
                        <path d="M19 16v5M16.5 18.5h5"></path>
                    </svg>
                </a>

                <a href="#" title="Reflection" aria-label="Reflection">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"></path>
                        <path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"></path>
                    </svg>
                </a>

                <a href="#" title="Stats" aria-label="Stats">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
                    </svg>
                </a>

                <a href="#" title="Music" aria-label="Music">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 14v-2a8 8 0 0 1 16 0v2"></path>
                        <path d="M4 14h3v7H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 1-2ZM20 14h-3v7h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-1-2Z"></path>
                    </svg>
                </a>
            </div>

            <div class="home">
                <div class="header">
                    <div>
                        <div id="live-date"></div>
                        <h3>Name your tree!</h3>
                        <input type="text" id="tree-name" placeholder="Enter your tree's name">
                        <button onclick="saveTreeName()">Save</button>
                    </div>

                    <div class="streak">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                        </svg>
                        <p>6 day streak</p>
                    </div>
                </div>

                <div class="garden">
                    <h3 id="tree-display">Your garden is waiting to grow!</h3>
                    <p>Every small step helps your tree grow. Take care of yourself and watch your garden bloom.</p>

                    <div class="progress-bar">
                        <p>Tree growth: 0 / 3 activities completed</p>
                    </div>
                </div>

                <div class="feels">
                    <button class="mood">Low</button>
                    <button class="mood">Meh</button>
                    <button class="mood">Okay</button>
                    <button class="mood">Good</button>
                    <button class="mood">Great</button>
                </div>

                <p>Take a moment for yourself. How would you like to recharge today?</p>

                <div class="self_care">
                    <h4>Quick care</h4>

                    <a href="#">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5"></path>
                            <path d="M3 12h16a2 2 0 1 1-2 2"></path>
                            <path d="M3 16h8a2.5 2.5 0 1 1-2.5 2.5"></path>
                        </svg>
                        Breathe
                    </a>

                    <a href="#">
                        <svg viewBox="0 0 24 24">
                            <path d="m15 5 4 4L8 20l-5 1 1-5Z"></path>
                            <path d="m13 7 4 4"></path>
                        </svg>
                        Reflect
                    </a>
                </div>
            </div>
        </div>

        <!-- Time and Date Script -->
        <script>
            function updateDate() {
                const now = new Date();

                const options = {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric'
                };

                const formattedDate = now.toLocaleDateString('en-US', options);

                document.getElementById('live-date').textContent = formattedDate;
            }

            function saveTreeName() {
                const name = document.getElementById('tree-name').value.trim();

                if (name === "") return;

                localStorage.setItem('treeName', name);
                document.getElementById('tree-display').textContent = name + "'s garden";
                document.getElementById('tree-name').value = "";
            }

            const savedName = localStorage.getItem('treeName');

            if (savedName) {
                document.getElementById('tree-display').textContent = savedName + "'s garden";
            }

            updateDate();
            setInterval(updateDate, 60000);
        </script>
    </body>
</html>
