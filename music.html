<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MindBloom · Music</title>
        <link rel="icon" href="favicon.svg">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/music.css">
    </head>
    
    <body>
        <div class="home">
            <!-- SIDEBAR -->
            <div class="side-bar">
                <a href="index.html" title="Home" aria-label="Home" style="display: contents;">
                    <div class="logo">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 20v-8"></path>
                            <path d="M12 12C12 7 16 4 21 4c0 5-3 9-9 9"></path>
                            <path d="M12 15C12 10 8 7 3 7c0 5 3 9 9 9"></path>
                        </svg>
                    </div>
                </a>
                    
                <a href="chat.html" title="Chat" aria-label="Chat">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3c.7 4.1 2.9 6.3 7 7-4.1.7-6.3 2.9-7 7-.7-4.1-2.9-6.3-7-7 4.1-.7 6.3-2.9 7-7Z"></path>
                        <path d="M19 16v5M16.5 18.5h5"></path>
                    </svg>
                </a>

                <a href="reflection.html" class="side-button" title="Journal">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"></path>
                        <path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"></path>
                    </svg>
                </a>

                <a href="stats.html" title="Stats" aria-label="Stats">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
                    </svg>
                </a>

                <a href="music.html" class="active" title="Music" aria-label="Music">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 14v-2a8 8 0 0 1 16 0v2"></path>
                        <path d="M4 14h3v7H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 1-2ZM20 14h-3v7h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-1-2Z"></path>
                    </svg>
                </a>

                <a href="user_achievement.html" class="active" title="Achievements" aria-label="Achievements">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </a>
            </div>
        
        <!-- MUSIC-->
        <div class="home">
            <div class="music-header">
                <span class="music-eyebrow">WHITE NOISE FOCUS</span>
                <h2>Settle into your flow</h2>
                <p>Real Spotify playlists for focus, rest, or quiet company.</p>
            </div>

            <div class="category-grid">
                <button class="category selected" data-key="deep-focus">🎧 Deep Focus</button>
                <button class="category" data-key="rain-sounds">🌧️ Rain Sounds</button>
                <button class="category" data-key="ocean-waves">🌊 Ocean Waves</button>
                <button class="category" data-key="classical">🎻 Classical Music</button>
                <button class="category" data-key="lofi">☕ Lofi Beats</button>
                <button class="category" data-key="find-your-own">🔍 Find your own</button>
            </div>

            <div id="find-own" class="find-own hidden">
                <input id="own-input" type="text" placeholder="Paste a Spotify link here">
                <button id="own-button">Load</button>
            </div>
            <span id="own-error" class="own-error"></span>

            <div class="now-playing">
                <strong id="now-title">Deep Focus</strong>
                <a id="open-spotify" href="https://open.spotify.com" target="_blank" rel="noopener">Open in Spotify ↗</a>
            </div>

            <div class="spotify-box">
                <iframe id="spotify-frame"
                    width="100%" height="352" frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"></iframe>
                <p id="no-playlist" class="no-playlist hidden"></p>
            </div>

            <p class="music-tip">Log in to Spotify in this browser to save songs from the player to your favorites.</p>
        </div>
    </div>

    <script src="js/user_achievements.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
