<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindBloom | Journal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reflection.css">
    <link rel="icon" href="favicon.svg">
    
    <!--headers for PWA-->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#5b8a5f">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

    <body>
        <div class="home">
            <!-- SIDEBAR -->
            <div class="side-bar">
                <a href="index.html" title="Home" aria-label="Home" style="display: contents;">
                    <div class="logo">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 20v-8"></path>
                            <path d="M12 12C12 7 16 4 21 4c0 5-3 9-9 9"></path>
                            <path d="M12 15C12 10 8 7 3 7c0 5 3 9 9 9"></path>
                        </svg>
                    </div>
                </a>

                <a href="chat.html" title="Chat" aria-label="Chat">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3c.7 4.1 2.9 6.3 7 7-4.1.7-6.3 2.9-7 7-.7-4.1-2.9-6.3-7-7 4.1-.7 6.3-2.9 7-7Z"></path>
                        <path d="M19 16v5M16.5 18.5h5"></path>
                    </svg>
                </a>

                <a href="reflection.html" class="active" class="side-button" title="Journal">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"></path>
                        <path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"></path>
                    </svg>
                </a>

                <a href="stats.html" title="Stats" aria-label="Stats">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
                    </svg>
                </a>

                <a href="music.html" title="Music" aria-label="Music">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 14v-2a8 8 0 0 1 16 0v2"></path>
                        <path d="M4 14h3v7H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 1-2ZM20 14h-3v7h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-1-2Z"></path>
                    </svg>
                </a>

                <a href="user_achievement.html" title="Achievements" aria-label="Achievements">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </a>

                <a href="profile.html" class="bottom-icon" title="Profile" aria-label="Profile">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                    </svg>
                </a>
            </div>

        <!-- JOURNAL CONTENT -->
        <div class="home journal-page">

            <header class="journal-header">
                <div>
                    <span class="eyebrow">PRIVATE ON THIS DEVICE</span>
                    <h2 id="journal-heading">What's on your mind?</h2>
                    <p id="journal-description">
                        Write without editing yourself. This space is yours.
                    </p>
                </div>

                <span class="date-chip" id="saved-count">0 saved</span>
            </header>

            <!-- TABS -->
            <div class="journal-tabs">
                <button class="active" id="write-tab" type="button">
                    Write
                </button>

                <button id="saved-tab" type="button">
                    Saved reflections <span id="tab-count">0</span>
                </button>
            </div>

            <!-- WRITE SECTION -->
            <div id="write-section">

                <div class="prompt-card">
                    <span>✦</span>

                    <div>
                        <small>TODAY'S PROMPT</small>
                        <p id="journal-prompt">
                            What do you need a little more of today?
                        </p>
                    </div>

                    <button id="new-prompt" type="button" title="New prompt">
                        ↻
                    </button>
                </div>

                <textarea
                    id="journal-input"
                    placeholder="Write here... let your thoughts flow."
                ></textarea>
               <div class="voice-note">
                <div class="voice-note-info">
                    <div class="voice-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                            <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
                            <path d="M12 19v3M8 22h8"></path>
                        </svg>
                    </div>

                    <div>
                        <strong>Voice note</strong>
                        <p id="recording-status">Record your thoughts instead of typing.</p>
                    </div>
                </div>

                <div class="voice-controls">
                    <button type="button" id="record-btn">Start recording</button>
                    <button type="button" id="stop-btn" disabled>Stop</button>
                </div>

                <audio id="voice-preview" controls hidden></audio>

                <button type="button" id="save-voice-btn" disabled>
                    Save voice note
                </button>

                <p id="voice-message"></p>
                <div id="voice-library"></div>
            </div>
                <div class="journal-footer">
                    <span id="word-count">0 words</span>

                    <button
                        class="primary-button"
                        id="save-reflection"
                        type="button"
                    >
                        Save reflection
                    </button>
                </div>

                <p id="save-message"></p>
            </div>

            <!-- SAVED REFLECTIONS -->
            <div id="saved-section" hidden>
                <div id="journal-library"></div>
            </div>

        </div>
    </div>

    <script>
        const journalInput = document.getElementById("journal-input");

        const prompts = [
            "What do you need a little more of today?",
            "What's something that's been on your mind lately?",
            "What is one small thing that made you happy today?",
            "What's something you wish people understood about you?",
            "What has been challenging you recently?",
            "What is something you're proud of yourself for?",
            "What would you tell yourself on a difficult day?",
            "What is one thing you want to let go of?",
            "What are you looking forward to?",
            "What does taking care of yourself look like today?"
        ];

        let currentPrompt = 0;

        const writeTab = document.getElementById("write-tab");
        const savedTab = document.getElementById("saved-tab");
        const writeSection = document.getElementById("write-section");
        const savedSection = document.getElementById("saved-section");
        const library = document.getElementById("journal-library");

        function getEntries() {
            return JSON.parse(
                localStorage.getItem("journalEntries") || "[]"
            );
        }

        function updateCount() {
            const words = journalInput.value.trim()
                ? journalInput.value.trim().split(/\s+/).length
                : 0;

            document.getElementById("word-count").textContent =
                words + " words";
        }

        function updateSavedCount() {
            const count = getEntries().length;

            document.getElementById("saved-count").textContent =
                count + " saved";

            document.getElementById("tab-count").textContent = count;
        }

        // WORD COUNT
        journalInput.addEventListener("input", updateCount);

        // CHANGE PROMPT
        document.getElementById("new-prompt").addEventListener("click", () => {
            currentPrompt = (currentPrompt + 1) % prompts.length;

            document.getElementById("journal-prompt").textContent =
                prompts[currentPrompt];
        });

        // WRITE TAB
        writeTab.addEventListener("click", () => {
            writeSection.hidden = false;
            savedSection.hidden = true;

            writeTab.classList.add("active");
            savedTab.classList.remove("active");

            document.getElementById("journal-heading").textContent =
                "What's on your mind?";

            document.getElementById("journal-description").textContent =
                "Write without editing yourself. This space is yours.";
        });

        // SAVED TAB
        savedTab.addEventListener("click", () => {
            writeSection.hidden = true;
            savedSection.hidden = false;

            savedTab.classList.add("active");
            writeTab.classList.remove("active");

            document.getElementById("journal-heading").textContent =
                "Your reflections";

            document.getElementById("journal-description").textContent =
                "A quiet record of the moments you made space for yourself.";

            displayEntries();
        });

        // SAVE REFLECTION
        document.getElementById("save-reflection").addEventListener("click", () => {
            const text = journalInput.value.trim();

            if (!text) {
                document.getElementById("save-message").textContent =
                    "Write something before saving your reflection.";
                return;
            }

            const entries = getEntries();

            entries.unshift({
                text: text,
                date: new Date().toLocaleString()
            });

            localStorage.setItem(
                "journalEntries",
                JSON.stringify(entries)
            );

            journalInput.value = "";
            updateCount();
            updateSavedCount();

            // COMPLETE REFLECTION ACTIVITY
            let buckets = parseInt(
                localStorage.getItem('mindbloom_buckets_logged') || '0',
                10
            );

            buckets += 1;

            localStorage.setItem('mindbloom_buckets_logged', buckets);

            // Tell homepage to play water animation
            localStorage.setItem('showWaterDrops', 'true');
        });

        // DISPLAY SAVED REFLECTIONS
        function displayEntries() {
            const entries = getEntries();

            library.innerHTML = "";

            if (entries.length === 0) {
                const empty = document.createElement("div");
                empty.className = "journal-empty";
                empty.textContent =
                    "No reflections saved yet. Your space is waiting for you 🌱";

                library.appendChild(empty);
                return;
            }

            entries.forEach(entry => {
                const card = document.createElement("article");
                card.className = "journal-entry";

                const date = document.createElement("small");
                date.textContent = entry.date;

                const content = document.createElement("p");
                content.textContent = entry.text;

                card.appendChild(date);
                card.appendChild(content);

                library.appendChild(card);
            });
        }

        updateCount();
        updateSavedCount();
        
    </script>
    <script src="js/voice.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/growth.js"></script>
</body>
</html>
